<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="わたしの勤務表">
<meta name="theme-color" content="#f3f5f8">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="../roster-calendar/icon-180.png">
<title>わたしの勤務表</title>
<style>
:root{--line:#9aa3ad;--head:#e9edf2;--sat:#1769c2;--sun:#d12f2f;--ink:#202832}
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
main{max-width:1100px;margin:auto;padding:16px}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px;background:#e9edf2;border-bottom:1px solid var(--line)}
.toolbar select,.toolbar button{font:inherit;font-size:16px;font-weight:700;padding:7px 9px;border:1px solid #aab3bd;border-radius:8px;background:white;color:var(--ink)}
.toolbar button{font-size:14px;white-space:nowrap}
.wrap{overflow-x:auto;background:white;border:1px solid #9aa3ad;border-radius:10px;touch-action:pan-y}
table{border-collapse:collapse;min-width:704px;width:704px;table-layout:fixed}
th,td{border:1px solid var(--line);text-align:center;padding:7px 5px;min-width:44px}
thead th{background:var(--head);font-weight:700}
th.today{background:#269b50!important;color:#fff!important}
th.team{user-select:none;-webkit-user-select:none;position:sticky;left:0;z-index:2;background:#e9edf2;min-width:65px}
tbody th.team{background:#f1f3f6}
.sat{color:var(--sat)!important}.sun,.holiday{color:var(--sun)!important}
.shift{font-size:18px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shift:active{filter:brightness(.94)}
.shift-ア,.shift-ア残,.shift-ア早{background:#dceeff}
.shift-ヤ,.shift-ヤ残,.shift-ヤ早{background:#ffe8cc}
.shift-ユ,.shift-ユ残,.shift-ユ早{background:#e2f3df}
.shift-休{background:#eceff3;color:#6b7280}
.shift-有給{background:#f7e5f2;color:#923d7b}
.shift .cell-value{display:block;min-height:1.25em}
.shift.is-changed .cell-value{color:#c2185b !important;text-shadow:0 0 .01px currentColor}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 2px;font-size:12px;color:#59636e}
.legend span{white-space:nowrap}
.help{font-size:12px;color:#626d79;line-height:1.55;margin:10px 2px}
.backup{display:flex;gap:8px;flex-wrap:wrap;margin:10px 2px}
.backup button{font:inherit;font-size:13px;padding:8px 10px;border:1px solid #aab3bd;border-radius:8px;background:#fff;color:var(--ink)}
#status{font-size:12px;color:#176b50;margin:5px 2px}
.portrait-only{display:none}
#editShade{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end;justify-content:center;padding:12px}
#editShade.open{display:flex}
#editPanel{width:min(100%,480px);background:white;border-radius:16px 16px 12px 12px;padding:16px;box-shadow:0 8px 30px #0003}
#editTitle{font-weight:800;font-size:17px;margin:0 0 12px}
#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#choices button{min-height:48px;border:1px solid #b8c2cb;border-radius:10px;background:#f8fafb;color:#202832;font:inherit;font-weight:800}
#choices button:active{background:#e1eee7}
#editActions{display:flex;gap:8px;margin-top:12px}
#editActions button{flex:1;min-height:42px;border:1px solid #b8c2cb;border-radius:9px;background:#fff;color:#202832;font:inherit}
#editActions #resetCell{background:#e9f4ef;color:#176b50;border-color:#a8c9b8}
#editActions #closeEditor{background:#edf0f3}
@media(orientation:landscape){main{max-width:none;width:100%;padding:8px calc(12px + env(safe-area-inset-right)) 8px calc(56px + env(safe-area-inset-left))}.wrap{max-height:calc(100dvh - 80px)}}
@media(orientation:portrait) and (max-width:700px){
 html,body{height:100%;overflow:hidden;overscroll-behavior:none}
 main{width:100%;max-width:none;height:100dvh;overflow:hidden;min-height:100dvh;display:flex;flex-direction:column;gap:5px;padding:6px 0}
 .wrap{width:100%;border-left:0;border-right:0;border-radius:0;overflow:hidden;flex:1 1 auto;min-height:0;touch-action:pan-y}
 .toolbar{flex:0 0 auto;padding:6px;gap:6px}
 .toolbar select{font-size:15px;min-width:0}
 table{min-width:0;width:100%;height:100%;table-layout:fixed}
 tbody tr:not(.section-gap){height:calc((100dvh - 112px)/10)}
 th,td{min-width:0;width:auto;padding:2px 1px;font-size:12px;overflow-wrap:anywhere}
 th.team{width:44px;min-width:44px}
 .shift{font-size:clamp(12px,3.8vw,16px)}
 .section-gap{height:4px;max-height:4px}
 .section-gap td{height:4px;max-height:4px;padding:0;border:0;background:#f3f5f8}
 .landscape-only{display:none}
 .portrait-only{display:table-row}
 .section-gap{height:6px}
 .section-gap td{height:6px;padding:0;border:0;background:#f3f5f8}
}
@media(orientation:landscape),(min-width:701px){.portrait-only{display:none}.landscape-only{display:table-row}}
@media(max-width:380px){.shift{font-size:13px}th,td{padding-left:0;padding-right:0}}
</style>
</head>
<body>
<main>
<div class="wrap" id="wrap">
<div class="toolbar">
<select id="year" aria-label="年"></select>
<select id="month" aria-label="月"></select>
<button type="button" id="currentMonth">当月</button>
</div>
<table id="calendar" aria-label="個人用組別勤務表"></table>
</div>
<div class="backup">
<button type="button" id="export">バックアップを書き出す</button>
<button type="button" id="importBtn">バックアップを読み込む</button>
<input id="importFile" type="file" accept="application/json,.json" hidden>
</div>
<div id="status" aria-live="polite"></div>
</main>
<div id="editShade" role="dialog" aria-modal="true" aria-labelledby="editTitle">
<div id="editPanel">
<p id="editTitle">勤務を選択</p>
<div id="choices"></div>
<div id="editActions"><button type="button" id="resetCell">元の勤務に戻す</button><button type="button" id="closeEditor">閉じる</button></div>
</div>
</div>
<script>
(()=>{
const KEY='personal-shift-calendar-v2';
const anchor=new Date(2026,10,1);
const patterns=[
 ['休','ヤ','ヤ','ヤ','ヤ','休','休','ア','ア','ア','ア','休','ユ','ユ','ユ','ユ'],
 ['ヤ','休','休','ア','ア','ア','ア','休','ユ','ユ','ユ','ユ','休','ヤ','ヤ','ヤ'],
 ['ア','ア','ア','休','ユ','ユ','ユ','ユ','休','ヤ','ヤ','ヤ','ヤ','休','休','ア'],
 ['ユ','ユ','ユ','ユ','休','ヤ','ヤ','ヤ','ヤ','休','休','ア','ア','ア','ア','休']
];
const $=id=>document.getElementById(id);
const todayParts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());
const todayKey=todayParts.find(p=>p.type==='year').value+'-'+String(Number(todayParts.find(p=>p.type==='month').value)).padStart(2,'0')+'-'+String(Number(todayParts.find(p=>p.type==='day').value)).padStart(2,'0');
let overrides=load(),editing=null;
const year=$('year'),month=$('month');
const currentYear=Number(todayParts.find(p=>p.type==='year').value),currentMonth=Number(todayParts.find(p=>p.type==='month').value);
for(let y=2026;y<=2099;y++){const o=document.createElement('option');o.value=y;o.textContent=y+'年';year.append(o)}
for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'月';month.append(o)}
year.value=String(currentYear);month.value=String(currentMonth);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}catch(e){return {}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(overrides));$('status').textContent='この端末に保存しました。'}catch(e){$('status').textContent='保存できませんでした。ブラウザの設定を確認してください。'}}
function key(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function defaultShift(row,date){const diff=Math.round((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.UTC(2026,10,1))/86400000);return patterns[row][((diff%16)+16)%16]}
function currentShift(row,k,base){return Object.prototype.hasOwnProperty.call(overrides,k+'|'+row)?overrides[k+'|'+row]:base}
function options(base,previousBase){if(base==='ア')return ['ア残','ア早','有休'];if(base==='ユ')return ['ユ残','ユ早','有休'];if(base==='ヤ')return ['ヤ残','ヤ早','有休'];if(base==='休'&&previousBase==='ヤ')return ['休','残'];return ['休']}
function cls(v){if(v==='有休'||v==='有給')return 'shift-有給';if(v.startsWith('ア'))return 'shift-ア';if(v.startsWith('ヤ'))return 'shift-ヤ';if(v.startsWith('ユ'))return 'shift-ユ';return 'shift-休'}
function jp(d){return new Intl.DateTimeFormat('ja-JP',{weekday:'short'}).format(d)}
function nthMonday(y,m,n){const d=new Date(y,m-1,1);return 1+((8-d.getDay())%7)+(n-1)*7}
function equinox(y,spring){return Math.floor(spring?20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4):23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4))}
function holidays(y){
 const h=new Set([y+'-01-01',y+'-02-11',y+'-02-23',y+'-04-29',y+'-05-03',y+'-05-04',y+'-05-05',y+'-08-11',y+'-11-03',y+'-11-23']);
 const add=(m,d)=>h.add(key(y,m,d));
 add(3,equinox(y,true));add(9,equinox(y,false));add(1,nthMonday(y,1,2));add(7,nthMonday(y,7,3));add(9,nthMonday(y,9,3));add(10,nthMonday(y,10,2));
 const base=[...h].map(s=>new Date(s+'T00:00:00'));
 for(const d of base)if(d.getDay()===0){let x=new Date(d);do{x.setDate(x.getDate()+1)}while(h.has(key(y,x.getMonth()+1,x.getDate())));add(x.getMonth()+1,x.getDate())}
 for(let m=1;m<=12;m++){const last=new Date(y,m,0).getDate();for(let d=2;d<last;d++){const cur=new Date(y,m-1,d),p=new Date(y,m-1,d-1),n=new Date(y,m-1,d+1);if(!h.has(key(y,m,d))&&h.has(key(y,m-1,p.getDate()))&&h.has(key(y,m+1,n.getDate()))&&cur.getDay()!==0)add(m,d)}}
 return h
}
function section(tbody,thead,y,m,start,end,mode,hs){
 const head=document.createElement('tr');head.className=mode;
 const label=document.createElement('th');label.className='team';label.textContent='組';head.append(label);
 for(let d=start;d<=end;d++){const dt=new Date(y,m-1,d),k=key(y,m,d),th=document.createElement('th');th.innerHTML=d+'<br>'+jp(dt);if(k===todayKey)th.classList.add('today');else if(hs.has(k)||dt.getDay()===0)th.classList.add('sun');else if(dt.getDay()===6)th.classList.add('sat');head.append(th)}
 (mode==='landscape-only'?thead:tbody).append(head);
 patterns.forEach((pat,r)=>{const tr=document.createElement('tr');tr.className=mode;const th=document.createElement('th');th.className='team';th.textContent=(r+1)+'組';tr.append(th);
 for(let d=start;d<=end;d++){const dt=new Date(y,m-1,d),k=key(y,m,d),base=defaultShift(r,dt),v=currentShift(r,k,base),td=document.createElement('td');td.className='shift '+cls(v)+(Object.prototype.hasOwnProperty.call(overrides,k+'|'+r)?' is-changed':'');td.dataset.date=k;td.dataset.row=String(r);td.dataset.base=base;td.setAttribute('role','button');td.setAttribute('tabindex','0');td.setAttribute('aria-label',k+' '+(r+1)+'組 '+v+'。タップして変更');const span=document.createElement('span');span.className='cell-value';span.textContent=v;td.append(span);tr.append(td)}
 tbody.append(tr)})
}
function render(){
 const y=Number(year.value),m=Number(month.value),days=new Date(y,m,0).getDate(),hs=holidays(y),table=$('calendar'),thead=document.createElement('thead'),tbody=document.createElement('tbody');
 section(tbody,thead,y,m,1,days,'landscape-only',hs);
 section(tbody,thead,y,m,1,Math.min(15,days),'portrait-only',hs);
 if(days>15){const gap=document.createElement('tr');gap.className='portrait-only section-gap';const td=document.createElement('td');td.colSpan=17;gap.append(td);tbody.append(gap);section(tbody,thead,y,m,16,days,'portrait-only',hs)}
 table.replaceChildren(thead,tbody)
}
function openEditor(cell){
 const k=cell.dataset.date,r=Number(cell.dataset.row),base=cell.dataset.base,v=currentShift(r,k,base);editing={k,r,base};
 $('editTitle').textContent=k.replaceAll('-','/')+'　'+(r+1)+'組';
 const box=$('choices');box.replaceChildren();
 const prevCell=cell.previousElementSibling;let prevBase=prevCell&&prevCell.dataset.base?prevCell.dataset.base:'';if(!prevBase){const prevDate=new Date(k+'T00:00:00');prevDate.setDate(prevDate.getDate()-1);prevBase=defaultShift(r,prevDate)}options(base,prevBase).forEach(choice=>{const b=document.createElement('button');b.type='button';b.textContent=choice;if(choice===v)b.style.border='2px solid #176b50';b.addEventListener('click',()=>{const id=k+'|'+r;if(choice===base)delete overrides[id];else overrides[id]=choice;persist();closeEditor();render()});box.append(b)});
 $('editShade').classList.add('open')
}
function closeEditor(){editing=null;$('editShade').classList.remove('open')}
$('calendar').addEventListener('click',e=>{const cell=e.target.closest('td[data-date]');if(cell)openEditor(cell)});
$('calendar').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('td[data-date]')){e.preventDefault();openEditor(e.target)}});
$('closeEditor').addEventListener('click',closeEditor);
$('editShade').addEventListener('click',e=>{if(e.target===$('editShade'))closeEditor()});
$('resetCell').addEventListener('click',()=>{if(!editing)return;delete overrides[editing.k+'|'+editing.r];persist();closeEditor();render()});
year.addEventListener('change',render);month.addEventListener('change',render);
$('currentMonth').addEventListener('click',()=>{year.value=String(currentYear);month.value=String(currentMonth);render()});
$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'personal-shift-calendar',version:2,overrides},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='勤務表バックアップ-'+todayKey+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='バックアップを書き出しました。'});
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.overrides||typeof data.overrides!=='object'||Array.isArray(data.overrides))throw new Error();if(!confirm('現在の勤務変更をバックアップ内容に置き換えますか？'))return;overrides=data.overrides;persist();render();$('status').textContent='バックアップを読み込みました。'}catch(err){alert('バックアップファイルを読み込めませんでした。')}finally{e.target.value=''}});
let sx=0,sy=0,swiping=false;
$('wrap').addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('select,button')){swiping=false;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY;swiping=true},{passive:true});
$('wrap').addEventListener('touchend',e=>{if(!swiping||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;swiping=false;if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.2)return;const n=new Date(Number(year.value),Number(month.value)-1+(dx<0?1:-1),1);if(n.getFullYear()<2026||n.getFullYear()>2099)return;year.value=String(n.getFullYear());month.value=String(n.getMonth()+1);render()},{passive:true});
render();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script>
</body>
</html>
