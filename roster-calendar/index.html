<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="勤務表">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-512.png" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<meta name="theme-color" content="#f3f5f8">
<title>勤務カレンダー</title>
<style>
h1.app-title{font-size:20px;line-height:1.3;margin:0;padding:12px 14px 10px;font-weight:800;color:#202832}
@media(max-width:600px){h1.app-title{font-size:18px;padding:10px 10px 8px}}
@media(orientation:landscape){main{max-width:none;width:100%;padding:8px 12px}.wrap{max-height:calc(100dvh - 24px)} }
:root{--line:#9aa3ad;--head:#e9edf2;--sat:#1769c2;--sun:#d12f2f;--ink:#202832}
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
main{max-width:1100px;margin:auto;padding:16px;touch-action:pan-y pinch-zoom}
.calendar-toolbar{display:flex;gap:8px;align-items:center;padding:10px;background:#e9edf2;border-bottom:1px solid var(--line)}
.calendar-toolbar select{font-size:17px;font-weight:700;padding:7px 9px;border:1px solid #aab3bd;border-radius:8px;background:white;color:var(--ink)}
.calendar-toolbar .current-month-button{font-size:14px;font-weight:700;padding:7px 12px;border:1px solid #aab3bd;border-radius:8px;background:#fff;color:var(--ink);white-space:nowrap}
.calendar-toolbar .current-month-button:active{background:#e2f3df}
.wrap{overflow-x:auto;background:white;border:1px solid #9aa3ad;border-radius:10px;touch-action:pan-y}
.page-stack{position:relative;isolation:isolate}
.page-underlay{position:absolute;z-index:-1;inset:0;background:#fff;border:1px solid #aeb7c1;border-radius:9px;transform:translateX(var(--underlay-x,0px)) translateY(6px) scale(.994);box-shadow:0 4px 9px rgba(32,40,50,.13);transition:transform .26s cubic-bezier(.22,.72,.25,1)}
.page-stack{--underlay-x:0px}
#calendar{will-change:transform;transition:transform .26s cubic-bezier(.22,.72,.25,1)}
.page-stack.is-dragging #calendar,.page-stack.is-dragging .page-underlay{transition:none}
.page-stack.is-settling #calendar,.page-stack.is-settling .page-underlay{transition:transform .26s cubic-bezier(.22,.72,.25,1)}
th.team{user-select:none;-webkit-user-select:none}
table{border-collapse:collapse;min-width:max-content;width:100%;table-layout:fixed}
th,td{border:1px solid var(--line);text-align:center;padding:7px 5px;min-width:43px}
thead th{background:var(--head);font-weight:700}th.today{background:#269b50!important;color:#fff!important}
th.team{position:sticky;left:0;z-index:2;background:#e9edf2;min-width:65px}
tbody th.team{background:#f1f3f6}
.sat{color:var(--sat)!important}.sun,.holiday{color:var(--sun)!important}
.shift{font-size:18px;font-weight:800}.shift-ア{background:#dceeff}.shift-ヤ{background:#ffe8cc}.shift-ユ{background:#e2f3df}.shift-休{background:#eceff3;color:#6b7280}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0;font-size:14px}
.note{font-size:12px;color:#626d79;line-height:1.6;margin-top:14px}
.warning{background:#fff7e6;border:1px solid #f0d28b;padding:10px 12px;border-radius:9px;font-size:13px;line-height:1.55;margin-top:12px}
@keyframes pageTurn{0%{transform:perspective(900px) rotateY(0deg) translateX(0);filter:brightness(1);box-shadow:0 0 0 rgba(32,40,50,0)}45%{transform:perspective(900px) rotateY(var(--turn-angle,-8deg)) translateX(var(--turn-shift,0px));filter:brightness(.96);box-shadow:0 9px 16px rgba(32,40,50,.2)}100%{transform:perspective(900px) rotateY(0deg) translateX(0);filter:brightness(1);box-shadow:0 0 0 rgba(32,40,50,0)}}
#calendar.page-turn{transform-origin:center center;backface-visibility:hidden;animation:pageTurn .46s cubic-bezier(.22,.72,.25,1)}
#calendar.page-turn.turn-next{transform-origin:left center;--turn-angle:-11deg;--turn-shift:-2px}
#calendar.page-turn.turn-prev{transform-origin:right center;--turn-angle:11deg;--turn-shift:2px}
@media(prefers-reduced-motion:reduce){#calendar.page-turn{animation:none}}
@media(max-width:600px){main{padding:10px}th,td{min-width:39px;padding:7px 3px}.shift{font-size:16px}}
@media(orientation:portrait) and (max-width:700px){
 table{min-width:704px;width:704px;table-layout:fixed}
 th,td{min-width:44px;padding:6px 3px;font-size:12px}
 th.team{width:44px;min-width:44px}
 .shift{font-size:16px}
 .landscape-only{display:none}
 .portrait-only{display:table-row}
}
@media(orientation:portrait) and (max-width:700px){
 html,body{height:100%;overflow:hidden;overscroll-behavior:none}
 main{width:100%;max-width:none;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none;min-height:100dvh;display:flex;flex-direction:column;gap:6px;padding:8px 0}
 .wrap{width:100%;border-left:0;border-right:0;border-radius:0}
 .page-stack,#calendar{width:100%}
 h1.app-title{flex:0 0 auto;padding:5px 8px;font-size:17px}
 .wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;overscroll-behavior-y:none;touch-action:pan-x}
 .calendar-toolbar{flex:0 0 auto;padding:7px;gap:7px}
 .page-stack{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
 #calendar{height:100%;min-height:100%;width:100%}
 #calendar tbody{height:100%}
 #calendar tbody tr:not(.section-gap){height:calc((100% - 22px)/10)}
 #calendar tbody tr.section-gap{height:22px}
 #calendar tbody tr.section-gap td{height:22px;padding:0;border:0;background:#f3f5f8}
 #calendar th,#calendar td{vertical-align:middle;padding-top:6px;padding-bottom:6px}
}
@media(orientation:landscape),(min-width:701px){
 .portrait-only{display:none}
 .landscape-only{display:table-row}
 .landscape-only td.shift{text-align:center!important;vertical-align:middle!important;padding-left:0!important;padding-right:0!important;text-indent:0!important}
}
</style>
</head>
<body>
<main>
<h1 class="app-title">勤務カレンダー</h1>
<div class="wrap">
<div class="calendar-toolbar"><select id="year" aria-label="年"></select><select id="month" aria-label="月"></select><button type="button" class="current-month-button" id="currentMonth">当月</button></div>
<div class="page-stack"><div class="page-underlay" aria-hidden="true"></div><table id="calendar" aria-label="組別勤務表"></table></div></div>
</main>
<script>
// 基準日：2026年11月1日。元表の上から4行を1組〜4組として登録。
const anchor = new Date(2026,10,1);
const patterns = [
 ['休','ヤ','ヤ','ヤ','ヤ','休','休','ア','ア','ア','ア','休','ユ','ユ','ユ','ユ'],
 ['ヤ','休','休','ア','ア','ア','ア','休','ユ','ユ','ユ','ユ','休','ヤ','ヤ','ヤ'],
 ['ア','ア','ア','休','ユ','ユ','ユ','ユ','休','ヤ','ヤ','ヤ','ヤ','休','休','ア'],
 ['ユ','ユ','ユ','ユ','休','ヤ','ヤ','ヤ','ヤ','休','休','ア','ア','ア','ア','休']
];
const jp=(n)=>new Intl.DateTimeFormat('ja-JP',{weekday:'short'}).format(n);
const nthMonday=(y,m,n)=>{let d=new Date(y,m-1,1);return 1+((8-d.getDay())%7)+(n-1)*7};
function equinox(y, spring){return Math.floor(spring ? 20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4) : 23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));}
function holidays(y){
 const h=new Set([`${y}-01-01`,`${y}-02-11`,`${y}-02-23`,`${y}-04-29`,`${y}-05-03`,`${y}-05-04`,`${y}-05-05`,`${y}-08-11`,`${y}-11-03`,`${y}-11-23`]);
 const add=(m,d)=>h.add(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
 add(3,equinox(y,true));add(9,equinox(y,false));
 add(1,nthMonday(y,1,2));add(7,nthMonday(y,7,3));add(9,nthMonday(y,9,3));add(10,nthMonday(y,10,2));
 // Substitute holidays: Sunday holidays move to next non-holiday day.
 const base=[...h].map(s=>new Date(s+'T00:00:00'));
 for(const d of base){if(d.getDay()===0){let x=new Date(d);do{x.setDate(x.getDate()+1)}while(h.has(`${y}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`));add(x.getMonth()+1,x.getDate());}}
 // Citizen's holiday between two national holidays (Japan's holiday law).
 for(let m=1;m<=12;m++){let last=new Date(y,m,0).getDate();for(let d=2;d<last;d++){let cur=new Date(y,m-1,d),p=new Date(y,m-1,d-1),n=new Date(y,m-1,d+1);let key=x=>`${y}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;if(!h.has(key(cur))&&h.has(key(p))&&h.has(key(n))&&cur.getDay()!==0)add(m,d);}}
 return h;
}
const year=document.getElementById('year'),month=document.getElementById('month');
// 初期表示は常に日本時間の当月。端末のタイムゾーン設定には依存しない。
const tokyoParts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric'}).formatToParts(new Date());
const currentYear=Number(tokyoParts.find(p=>p.type==='year').value);
const currentMonth=Number(tokyoParts.find(p=>p.type==='month').value);
for(let y=2026;y<=2099;y++){let o=document.createElement('option');o.value=y;o.textContent=y+'年';if(y===currentYear)o.selected=true;year.append(o)}
for(let m=1;m<=12;m++){let o=document.createElement('option');o.value=m;o.textContent=m+'月';if(m===currentMonth)o.selected=true;month.append(o)}
function render(animate=false,direction=0){
 const y=+year.value,m=+month.value,days=new Date(y,m,0).getDate(),hs=holidays(y);
 const t=document.getElementById('calendar');t.replaceChildren();
 const thead=document.createElement('thead'),tbody=document.createElement('tbody');
 function appendSection(start,end,visibility){
  const hr=document.createElement('tr');hr.className=visibility;
  const teamHead=document.createElement('th');teamHead.className='team';teamHead.textContent='組';hr.append(teamHead);
  for(let d=start;d<=end;d++){
   let date=new Date(y,m-1,d),th=document.createElement('th'),key=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
   th.innerHTML=d+'<br>'+jp(date);
   const todayKey=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
   if(key===todayKey)th.classList.add('today');
   else if(hs.has(key)||date.getDay()===0)th.classList.add('sun');else if(date.getDay()===6)th.classList.add('sat');
   hr.append(th);
  }
  (visibility==='landscape-only'?thead:tbody).append(hr);
  patterns.forEach((pat,i)=>{
   let tr=document.createElement('tr');tr.className=visibility;
   let th=document.createElement('th');th.className='team';th.textContent=(i+1)+'組';tr.append(th);
   for(let d=start;d<=end;d++){
    let td=document.createElement('td');
    let diff=Math.round((Date.UTC(y,m-1,d)-Date.UTC(2026,10,1))/86400000);
    let shift=pat[((diff%16)+16)%16];td.textContent=shift;td.className='shift shift-'+shift;tr.append(td);
   }
   tbody.append(tr);
  });
 }
 appendSection(1,days,'landscape-only');
 appendSection(1,Math.min(15,days),'portrait-only');
 if(days>15){
  const gap=document.createElement('tr');gap.className='portrait-only section-gap';
  const gapCell=document.createElement('td');gapCell.colSpan=32;gapCell.setAttribute('aria-hidden','true');gap.append(gapCell);tbody.append(gap);
  appendSection(16,days,'portrait-only');
 }
 t.append(thead,tbody);
 if(animate){t.classList.remove('page-turn','turn-next','turn-prev');void t.offsetWidth;t.classList.add('page-turn');if(direction>0)t.classList.add('turn-next');else if(direction<0)t.classList.add('turn-prev');}
}
year.addEventListener('change',()=>render(true));month.addEventListener('change',()=>render(true));
document.getElementById('currentMonth').addEventListener('click',()=>{
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric'}).formatToParts(new Date());
 year.value=String(Number(parts.find(p=>p.type==='year').value));
 month.value=String(Number(parts.find(p=>p.type==='month').value));
 render(true);
});
render();

// 画面内のどこからでも左右スワイプで月を切り替える。
const pageStack=document.querySelector('.page-stack');
const calendarWrap=document.querySelector('main');
let swipeStartX=0,swipeDeltaX=0,swipePointer=null,turnPending=false;
function clearSwipeStyles(){
 pageStack.classList.remove('is-dragging','is-settling');
 pageStack.style.removeProperty('--underlay-x');
 document.getElementById('calendar').style.removeProperty('transform');
}
function changeMonthBy(delta){
 const next=new Date(+year.value,+month.value-1+delta,1);
 year.value=String(next.getFullYear());
 month.value=String(next.getMonth()+1);
 render(true,delta);
 clearSwipeStyles();
 turnPending=false;
}
document.addEventListener('pointerdown',e=>{
 if(e.pointerType!=='touch'||turnPending||e.target.closest('select,button,input'))return;
 swipePointer=e.pointerId;swipeStartX=e.clientX;swipeDeltaX=0;
 pageStack.classList.add('is-dragging');
 if(e.target.setPointerCapture)e.target.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
 if(swipePointer!==e.pointerId||turnPending)return;
 swipeDeltaX=e.clientX-swipeStartX;
 const width=pageStack.clientWidth||calendarWrap.clientWidth;
 const limited=Math.max(-width,Math.min(width,swipeDeltaX));
 document.getElementById('calendar').style.transform=`translateX(${limited}px)`;
 pageStack.style.setProperty('--underlay-x',`calc(${limited<0?'100%':'-100%'} + ${limited}px)`);
});
function finishSwipe(e){
 if(swipePointer!==e.pointerId)return;
 const dx=swipeDeltaX;
 swipePointer=null;
 const width=pageStack.clientWidth||calendarWrap.clientWidth;
 if(Math.abs(dx)>Math.max(65,width*.18)){
  turnPending=true;
  pageStack.classList.remove('is-dragging');
  pageStack.classList.add('is-settling');
  const direction=dx<0?1:-1;
  document.getElementById('calendar').style.transform=`translateX(${direction*width}px)`;
  pageStack.style.setProperty('--underlay-x','0px');
  const done=()=>{document.getElementById('calendar').removeEventListener('transitionend',done);changeMonthBy(direction);};
  document.getElementById('calendar').addEventListener('transitionend',done);
  setTimeout(()=>{if(turnPending)changeMonthBy(direction);},350);
 }else{
  pageStack.classList.remove('is-dragging');
  pageStack.classList.add('is-settling');
  document.getElementById('calendar').style.transform='translateX(0px)';
  pageStack.style.setProperty('--underlay-x','0px');
  setTimeout(clearSwipeStyles,280);
 }
 swipeDeltaX=0;
}
document.addEventListener('pointerup',finishSwipe);
document.addEventListener('pointercancel',finishSwipe);
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body></html>
